spring:
  datasource:
    # Mesma convenção DB_* do docker-compose.yml. Defaults pensados para rodar a app
    # LOCALMENTE com `mvn spring-boot:run` contra o Postgres do compose
    # (DB_HOST=localhost). Sem variáveis definidas, usa eq11/eq11.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:eq11}
    username: ${DB_USER:eq11}
    password: ${DB_PASSWORD:eq11}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # validate: o Hibernate verifica se o schema do banco bate com as entidades,
      # mas NÃO modifica nada. O Flyway é responsável por criar/alterar as tabelas.
      # NUNCA use create-drop em produção — apaga todos os dados!
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    # Localização dos scripts de migração SQL
    locations: classpath:db/migration

logging:
  level:
    br.ufpb.dsc.studyai: DEBUG
    org.springframework.web: DEBUG
