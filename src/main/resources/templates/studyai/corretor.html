<!DOCTYPE html>
<!--
  Página do módulo CorretorIA.
  O formulário usa HTMX: ao enviar, o POST /corretor/avaliar devolve um fragmento
  com a avaliação da redação, que substitui #corretor-resultado. Sem recarregar a página.
-->
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{studyai/layout :: layout(~{::main})}">
<body>
<main class="main">

    <div class="page-header">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
            <h1 class="page-title">CorretorIA</h1>
            <span class="badge badge-purple">Módulo 2</span>
        </div>
        <div class="page-desc">Cole sua redação e receba uma correção detalhada com nota e critérios avaliados pela banca.</div>
    </div>

    <div class="grid-2" style="align-items:start">
        <!-- ===== FORMULÁRIO ===== -->
        <div>
            <div class="card">
                <div class="card-title">Nova Redação</div>

                <form hx-post="/corretor/avaliar"
                      hx-target="#corretor-resultado"
                      hx-swap="innerHTML"
                      hx-indicator="#corretor-loading"
                      hx-disabled-elt="#btn-avaliar">

                    <div class="form-group">
                        <label>Banca / Padrão de Correção</label>
                        <!-- Hidden input alimentado pelos chips (reutilizando a lógica do studyai.js) -->
                        <input type="hidden" id="banca" name="banca" value="ENEM"/>
                        <div class="chips">
                            <div class="chip selected" onclick="selectChip(this,'banca')">ENEM</div>
                            <div class="chip" onclick="selectChip(this,'banca')">Cebraspe</div>
                            <div class="chip" onclick="selectChip(this,'banca')">FGV</div>
                            <div class="chip" onclick="selectChip(this,'banca')">FCC</div>
                            <div class="chip" onclick="selectChip(this,'banca')">Vunesp</div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Tema da Redação</label>
                        <input type="text" name="tema" required
                               placeholder="Ex: Os desafios da inteligência artificial na educação..."
                               style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-color);">
                    </div>

                    <div class="form-group">
                        <label>Texto da Redação</label>
                        <textarea name="texto" rows="12" required
                                  placeholder="Cole aqui o texto da sua redação..."
                                  oninput="updateWC(this,'corretor-wc')"
                                  style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-color); resize: vertical;"></textarea>
                        <div class="wc" id="corretor-wc">0 palavras</div>
                    </div>

                    <button type="submit" class="btn btn-primary" id="btn-avaliar"
                            style="width:100%;justify-content:center">
                        <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z" clip-rule="evenodd"/></svg>
                        Corrigir Redação
                    </button>
                </form>
            </div>
        </div>

        <!-- ===== RESULTADO ===== -->
        <div>
            <!-- Indicador de carregamento HTMX (sibling do alvo, não é substituído) -->
            <div id="corretor-loading" class="card htmx-indicator">
                <div class="loading">
                    <div class="spinner"></div>
                    <div class="loading-text">IA lendo e corrigindo a redação...</div>
                </div>
            </div>
            <div id="corretor-resultado">
                <!-- Redação reaberta (GET /corretor/{id}): renderiza o resultado já preenchido -->
                <th:block th:if="${redacao != null}">
                    <div th:replace="~{studyai/fragments/corretor-result :: avaliacao}"></div>
                </th:block>
                <!-- Placeholder inicial (quando não há redação carregada) -->
                <th:block th:if="${redacao == null}">
                    <div class="card placeholder-card">
                        <div class="placeholder-emoji">📝</div>
                        <div class="placeholder-text">A correção da sua redação aparecerá aqui</div>
                    </div>
                </th:block>
            </div>
        </div>
    </div>

</main>
</body>
</html>
