<!DOCTYPE html>
<!--
  Página de login do StudyAI — tema escuro, fontes Syne + DM Sans (identidade do MVP).

  Spring Security Form Login:
  - O formulário faz POST para /login (URL processada internamente pelo Spring Security).
  - Os campos devem ter name="username" e name="password".
  - th:action="@{/login}" injeta automaticamente o token CSRF como campo oculto.
  - Falha → redireciona para /login?error ; logout → /login?logout.
-->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Entrar — StudyAI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin"/>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap"
          rel="stylesheet"/>

    <!-- Reaproveita as variáveis de cor/paleta do StudyAI -->
    <link rel="stylesheet" th:href="@{/css/studyai.css}"/>

    <style>
        .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
        .login-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);
            border-radius:var(--r);padding:36px 32px;box-shadow:0 24px 60px rgba(0,0,0,0.45)}
        .login-logo{text-align:center;margin-bottom:8px}
        .login-logo .logo-mark{font-family:'Syne',sans-serif;font-size:30px;font-weight:800;letter-spacing:-0.5px}
        .login-logo .logo-mark span{color:var(--accent)}
        .login-sub{text-align:center;font-size:12px;color:var(--text3);letter-spacing:0.06em;
            text-transform:uppercase;margin-bottom:28px}
        .login-title{font-family:'Syne',sans-serif;font-size:16px;font-weight:600;text-align:center;
            margin-bottom:22px;color:var(--text2)}
        .alert{border-radius:var(--r2);padding:11px 14px;font-size:13px;margin-bottom:18px;line-height:1.5}
        .alert-error{background:var(--red-bg);border:1px solid rgba(239,68,68,0.3);color:#fda4a4}
        .alert-ok{background:var(--green-bg);border:1px solid rgba(34,197,94,0.3);color:#86efac}
        .login-card .btn-primary{width:100%;justify-content:center;margin-top:4px}
        .login-hint{margin-top:20px;text-align:center;font-size:12px;color:var(--text3);
            background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);padding:9px}
        .login-hint strong{color:var(--text2)}
    </style>
</head>
<body>

<div class="login-wrap">
    <div class="login-card">
        <div class="login-logo">
            <div class="logo-mark">Study<span>AI</span></div>
        </div>
        <div class="login-sub">Concursos &amp; ENEM</div>

        <div class="login-title">Acesse sua conta</div>

        <!-- Erro de autenticação (?error) -->
        <div th:if="${param.error}" class="alert alert-error">
            Usuário ou senha inválidos. Tente novamente.
        </div>
        <!-- Logout efetuado (?logout) -->
        <div th:if="${param.logout}" class="alert alert-ok">
            Logout realizado com sucesso.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Usuário</label>
                <input type="text" id="username" name="username"
                       placeholder="Digite seu usuário"
                       autocomplete="username" required="required" autofocus="autofocus"/>
            </div>
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password"
                       placeholder="Digite sua senha"
                       autocomplete="current-password" required="required"/>
            </div>
            <button type="submit" class="btn btn-primary">
                <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 3a1 1 0 011 1v12a1 1 0 11-2 0V4a1 1 0 011-1zm7.707 3.293a1 1 0 010 1.414L9.414 9H17a1 1 0 110 2H9.414l1.293 1.293a1 1 0 01-1.414 1.414l-3-3a1 1 0 010-1.414l3-3a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
                Entrar
            </button>
        </form>

        <div class="login-hint">
            <strong>Demonstração:</strong> admin / admin123
        </div>
    </div>
</div>

</body>
</html>
