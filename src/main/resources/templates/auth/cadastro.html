<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Cadastro — StudyAI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin"/>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap"
          rel="stylesheet"/>

    <link rel="stylesheet" th:href="@{/css/studyai.css}"/>

    <style>
        .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
        .login-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);
            border-radius:var(--r);padding:36px 32px;box-shadow:0 24px 60px rgba(0,0,0,0.45)}
        .login-logo{text-align:center;margin-bottom:8px}
        .login-logo .logo-mark{font-family:'Syne',sans-serif;font-size:30px;font-weight:800;letter-spacing:-0.5px}
        .login-logo .logo-mark span{color:var(--accent)}
        .login-sub{text-align:center;font-size:12px;color:var(--text3);letter-spacing:0.06em;
            text-transform:uppercase;margin-bottom:28px}
        .login-title{font-family:'Syne',sans-serif;font-size:16px;font-weight:600;text-align:center;
            margin-bottom:22px;color:var(--text2)}
        .alert{border-radius:var(--r2);padding:11px 14px;font-size:13px;margin-bottom:18px;line-height:1.5}
        .alert-error{background:var(--red-bg);border:1px solid rgba(239,68,68,0.3);color:#fda4a4}
        .login-card .btn-primary{width:100%;justify-content:center;margin-top:4px}
    </style>
</head>
<body>

<div class="login-wrap">
    <div class="login-card">
        <div class="login-logo">
            <div class="logo-mark">Study<span>AI</span></div>
        </div>
        <div class="login-sub">Concursos &amp; ENEM</div>

        <div class="login-title">Crie sua conta</div>

        <!-- Erro de cadastro -->
        <div th:if="${erro}" class="alert alert-error" th:text="${erro}">
        </div>

        <form th:action="@{/cadastro/salvar}" method="post">
            <div class="form-group">
                <label for="username">Usuário</label>
                <input type="text" id="username" name="username"
                       placeholder="Escolha um nome de usuário"
                       autocomplete="username" required="required" autofocus="autofocus"/>
            </div>
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password"
                       placeholder="Crie sua senha"
                       autocomplete="new-password" required="required"/>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirme a Senha</label>
                <input type="password" id="confirmPassword" name="confirmPassword"
                       placeholder="Digite a senha novamente"
                       autocomplete="new-password" required="required"/>
            </div>
            <button type="submit" class="btn btn-primary">
                <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor"><path d="M8 9a3 3 0 100-6 3 3 0 000 6zM8 11a6 6 0 00-6 6 1 1 0 001 1h7a1 1 0 00.7-1.71A5.98 5.98 0 008 11zM16 7a1 1 0 10-2 0v1h-1a1 1 0 100 2h1v1a1 1 0 102 0v-1h1a1 1 0 100-2h-1V7z"/></svg>
                Cadastrar
            </button>
        </form>

        <a th:href="@{/login}" class="btn btn-secondary" style="width:100%;justify-content:center;margin-top:10px;text-decoration:none">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 3a1 1 0 011 1v12a1 1 0 11-2 0V4a1 1 0 011-1zm7.707 3.293a1 1 0 010 1.414L9.414 9H17a1 1 0 110 2H9.414l1.293 1.293a1 1 0 01-1.414 1.414l-3-3a1 1 0 010-1.414l3-3a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
            Voltar para o Login
        </a>
    </div>
</div>

</body>
</html>
