spring:
  datasource:
    # Em produção as credenciais vêm de variáveis de ambiente (arquivo .env injetado
    # pelo docker-compose.yml) — NUNCA hardcode segredos neste arquivo, que é
    # versionado no git. A URL é montada a partir de DB_HOST/DB_PORT/DB_NAME.
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    br.ufpb.dsc.studyai: INFO
    org.springframework.web: WARN
